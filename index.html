const PROD=[["Peak Milk Powder","Dairy","400g",46,40,24,8],["Peak Milk Powder","Dairy","900g",98,88,10,4],["Cowbell Milk Powder","Dairy","400g",44,38,3,6],["Nido Milk Powder","Dairy","400g",52,45,12,5],["Ideal Evaporated Milk","Dairy","170g",6,4.8,60,20],["Milo","Beverages","400g",48,42,18,6],["Bournvita","Beverages","450g",45,39,0,5],["Lipton Tea","Beverages","25 bags",10,8,20,6],["Frytol Vegetable Oil","Oils","1L",32,28,15,6],["Gino Tomato Paste","Canned","70g",2.5,1.8,120,40],["Sardine in Oil","Canned","125g",9,7.2,2,10],["Maggi Cubes","Seasoning","100 pcs",30,26,9,4],["Shito Black Pepper","Condiments","250g",18,14,8,4],["Royal Aroma Rice","Grains","5kg",85,75,14,5],["Gari","Grains","1kg",12,9,30,10],["Indomie Noodles","Noodles","70g",3.5,2.8,100,30],["Spaghetti","Pasta","500g",8,6.5,35,10],["Sugar","Staples","1kg",14,11.5,22,8],["Salt Fine","Staples","500g",4,3,40,10],["Voltic Water","Drinks","1.5L",4,2.9,48,24],["Coca-Cola","Drinks","500ml",5,3.8,36,24],["Sachet Water","Drinks","30 sachets",6,4.5,40,10],["Bread","Bakery","medium",12,9.5,14,6],["Eggs","Fresh","crate",65,57,6,3],["Toilet Roll","Household","4 pack",18,14,16,6],["Key Soap","Household","bar",5,3.8,45,15],["Omo Detergent","Household","500g",16,13,20,8],["Colgate Toothpaste","Personal Care","100g",14,11,18,6],["Vaseline Jelly","Personal Care","250ml",15,12,11,5]];
const CUST=[["Fatima Alhassan","0244120001",800],["Abdul-Rahman Issah","0200120002",600],["Mariam Seidu","0553120003",800],["Mohammed Yakubu","0244120004",500],["Hajia Zenabu","0277120005",1000]];
let S,view='',CART,ui={},CHAT=[],modalCb;
const store={get(){try{return localStorage.getItem(LS)}catch(e){return window.__m||null}},set(v){try{localStorage.setItem(LS,v)}catch(e){window.__m=v}}};
const save=()=>store.set(JSON.stringify(S));
const H=s=>{let h=5381;for(const c of 'jz'+s)h=(h*33)^c.charCodeAt(0);return (h>>>0).toString(36)};
const money=n=>'GH₵ '+(+n).toFixed(2),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),$=s=>document.querySelector(s);
const day0=t=>{const d=new Date(t);d.setHours(0,0,0,0);return +d},pad=(n,p)=>p+String(n).padStart(4,'0');
const me=()=>S.users.find(u=>u.id==S.ses),isM=()=>me().r=='owner',own=()=>me()&&me().r=='owner',adm=()=>me()&&me().r=='admin',prod=id=>S.products.find(p=>p.id==id),cust=id=>S.customers.find(c=>c.id==id);
const bal=c=>S.sales.filter(s=>s.cu==c.id&&s.m=='credit').reduce((a,s)=>a+s.tot,0)-S.pay.filter(p=>p.cu==c.id).reduce((a,p)=>a+p.amt,0);
const hay=p=>(p.n+' '+p.u+' '+p.c).toLowerCase(),pend=()=>S.cloud?[...S.sales,...S.pay].filter(x=>!x.sy).length:0;
const newCart=()=>({it:{},m:'cash',cu:'',net:'MTN MoMo',ref:'',tend:'',note:''}),ctot=()=>Object.keys(CART.it).reduce((a,id)=>a+prod(id).p*CART.it[id],0);
const fld=(id,l,v,t)=>`<label>${l}<input id="${id}" type="${t||'text'}" value="${esc(v)}"></label>`;
const MN={cash:'Cash',momo:'Mobile Money',credit:'Credit ledger'};

function seed(){return{sup:[],ord:[],on:1,users:[],products:[],customers:[],sales:[],pay:[],n:1,pn:1,ses:'',th:''}}
function seedDemo(){let r=7;const rnd=()=>(r=(r*16807)%2147483647)/2147483647;
 const P=PROD.map((a,i)=>({id:'p'+i,n:a[0],c:a[1],u:a[2],p:a[3],k:a[4],s:a[5],m:a[6]}));
 const C=CUST.map((a,i)=>({id:'c'+i,n:a[0],ph:a[1],em:'',lim:a[2]}));
 const U=[{id:'u1',n:'Hajia Rahina (Owner)',r:'owner',h:H('1111'),on:1},{id:'u2',n:'Yakubu (Attendant)',r:'attendant',h:H('2222'),on:1},{id:'u3',n:'System Admin',r:'admin',h:H('9999'),on:1}];
 const sales=[],now=Date.now();
 for(let d=6;d>=0;d--){const cnt=8+Math.floor(rnd()*8);for(let j=0;j<cnt;j++){
  const t=day0(now-d*864e5)+(8+Math.floor(rnd()*11))*36e5+Math.floor(rnd()*36e5);if(t>now)continue;
  const it=[];for(let q=0,k=1+Math.floor(rnd()*4);q<k;q++){const p=P[Math.floor(rnd()*P.length)];if(!it.find(x=>x.id==p.id))it.push({id:p.id,n:p.n+' '+p.u,q:1+Math.floor(rnd()*3),p:p.p,k:p.k})}
  const m=['cash','cash','momo','credit'][Math.floor(rnd()*4)];
  sales.push({t,u:rnd()<.7?'u2':'u1',it,tot:it.reduce((a,x)=>a+x.p*x.q,0),m,cu:m=='credit'?'c'+Math.floor(rnd()*5):'',sy:1})}}
 sales.sort((a,b)=>a.t-b.t).forEach((s,i)=>s.id=pad(i+1,'S'));
 return{users:U,products:P,customers:C,sales,pay:[{id:'R0001',t:now-2*864e5,cu:'c0',amt:60,m:'cash',u:'u1',sy:1},{id:'R0002',t:now-864e5,cu:'c2',amt:100,m:'momo',u:'u1',sy:1}],n:sales.length+1,pn:3,ses:'',th:''}}

function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(ui.tt);ui.tt=setTimeout(()=>e.style.display='none',2600)}
function modal(h){$('#modal').innerHTML=`<div class=ov onclick="if(event.target==this)closeM()"><div class=md>${h}</div></div>`}

function go(url){const a=document.createElement('a');a.href=url;a.click()}

/* ---------- auth ---------- */
function setupV(){$('#app').innerHTML=`<div class=login><div class=lc><div class=logo>JZ</div><h1>Welcome</h1><p class=mu>Set up this shop. Create the System Administrator account first, then add the Owner and Attendants from the Admin tab.</p><div style="text-align:left">${fld('s1','Administrator name','')}${fld('s2','PIN (4–8 digits)','','password')}${fld('s3','Confirm PIN','','password')}</div><button class=btn onclick=setup()>Create and continue</button><p class="err sm" id=serr></p>${CFG.api?'<p class=sm><a href=# onclick="connectV();return false">Shop already set up on another device? Connect this device</a></p>':''}</div></div>`}
function setup(){const n=$('#s1').value.trim(),p=$('#s2').value,e=$('#serr');if(!n){e.textContent='Enter a name';return}if(!/^\d{4,8}$/.test(p)){e.textContent='PIN must be 4–8 digits';return}if(p!=$('#s3').value){e.textContent='PINs do not match';return}const u={id:'u'+Date.now(),n,r:'admin',h:H(p),on:1};S.users.push(u);S.ses=u.id;save();view='';render()}
function loginV(){if(!S.users.length)return setupV();$('#app').innerHTML=`<div class=login><div class=lc><div class=logo>JZ</div><h1>JalZintech POS</h1><p class=mu>Provision shop manager · Tamale</p>
<div class=urs>${S.users.filter(u=>u.on).map(u=>`<button class="chip ${ui.lu==u.id?'on':''}" onclick="ui.lu='${u.id}';loginV()">${esc(u.n)}<small>${u.r}</small></button>`).join('')}</div>
<input id=pin type=password inputmode=numeric maxlength=8 placeholder="Enter PIN" onkeydown="if(event.key=='Enter')login()"><button class=btn onclick=login()>Sign in</button>
<p class="err sm" id=lerr></p></div></div>`}
function login(){const u=S.users.find(x=>x.id==ui.lu),e=$('#lerr');
 if(!u){e.textContent='Choose your name first';return}
 if(Date.now()<(ui.lock||0)){e.textContent='Too many attempts. Wait 30 seconds.';return}
 if(H($('#pin').value)==u.h){const hh=H($('#pin').value);ui.fail=0;S.ses=u.id;save();view=location.hash.slice(1);render();if(S.cloud&&navigator.onLine)api({act:'login',id:u.id,h:hh},'x').then(r=>{S.toks[u.id]=r.token;save();sync(true)}).catch(()=>sync(true));else sync(true)}
 else{ui.fail=(ui.fail||0)+1;if(ui.fail>=5){ui.lock=Date.now()+3e4;ui.fail=0}e.textContent='Wrong PIN'}}
function logout(){S.ses='';save();loginV()}

/* ---------- shell ---------- */
function render(){if(!S.ses||!me()){loginV();return}
 const u=me(),tabs=TABS.filter(t=>t[3].includes(u.r));if(!tabs.find(t=>t[0]==view))view=tabs[0][0];
 $('#app').innerHTML=`<nav class=nav><div class=brand><div class=logo>JZ</div>JalZintech POS</div>${tabs.map(t=>`<a href="#${t[0]}" class="${view==t[0]?'on':''}"><span>${t[1]}</span>${t[2]}</a>`).join('')}</nav>
 <div class=main><header class=top><h1>${tabs.find(t=>t[0]==view)[2]}</h1><span id=net class=pill></span><button class=ic onclick=theme() title="Theme">◐</button><button class=ic onclick=logout()>${esc(u.n.split(' ')[0])} ⎋</button></header><main id=v></main></div>`;
 netui();views[view]()}
function netui(){const e=$('#net');if(!e)return;const o=navigator.onLine,p=pend();e.className='pill '+(o?'ok':'off');e.textContent=(o?'Online':'Offline · saving on device')+(p?' · '+p+' to sync':'')}

/* ---------- cloud sync (shared database) ---------- */
const dv=()=>S.dev||(S.dev=Math.random().toString(36).slice(2,6)),tok=()=>(S.toks||{})[S.ses]||'',
 usig=u=>JSON.stringify({id:u.id,n:u.n,r:u.r,on:u.on,h:u.h}),psig=p=>{const{s,...r}=p;return JSON.stringify(r)},
 pendQ=id=>S.sales.filter(x=>!x.sy).reduce((a,x)=>a+x.it.filter(i=>i.id==id).reduce((b,i)=>b+i.q,0),0);
async function api(b,t){const r=await fetch(CFG.api,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(t===undefined?tok():t)},body:JSON.stringify(b)});let j={};try{j=await r.json()}catch(e){}if(!r.ok){const e=new Error(j.error||'Error '+r.status);e.st=r.status;throw e}return j}
function build(){const sn=S.snap,P={};
 P.products=S.products.map(p=>{const k=sn.products[p.id],a=p.s+pendQ(p.id);return !k||k.j!=psig(p)||k.s!=a?{...p,ds:a-(k?k.s:0)}:null}).filter(Boolean);
 for(const k of['customers','sup','ord'])P[k]=S[k].filter(x=>sn[k][x.id]!==JSON.stringify(x));
 P.sales=S.sales.filter(x=>!x.sy);P.pay=S.pay.filter(x=>!x.sy);P.users=S.users.filter(u=>sn.users[u.id]!==usig(u));return P}
function apply(r){let n=0;const sn=S.snap,rc=r.recs||{};

async function sync(q){if(!S.cloud||!CFG.api)return;if(!tok()){if(!q)toast('Sign out and sign in again while online to start syncing.');return}
 if(!navigator.onLine){if(!q)toast('Still offline. Everything is safe on this device.');return}if(ui.sy)return;ui.sy=1;
 try{let ch=0;for(let g=0;g<10;g++){const P=build(),sent=P.sales.concat(P.pay),r=await api({act:'sync',since:S.since||0,push:P});sent.forEach(x=>x.sy=1);ch+=sent.length+apply(r);S.since=r.seq;save();if(!r.more)break}
  netui();if(ch)refreshView();if(!q)toast('Synced')}
 catch(e){if(e.st==401){S.toks[S.ses]='';save();if(!q)toast('Cloud sign-in expired. Sign out and sign in again while online.')}else if(!q)toast('Could not reach the cloud: '+e.message)}
 finally{ui.sy=0;netui()}}

function rtext(s){const c=cust(s.cu),u=S.users.find(x=>x.id==s.u),L=['JalZintech Provision Shop','Tamale, Northern Ghana','Receipt '+s.id,new Date(s.t).toLocaleString('en-GB'),'Served by: '+(u?u.n.split(' (')[0]:'-'),'------------------'];

views.users=()=>{$('#v').innerHTML=`<div class=bar><h2>Users and system</h2><button class=btn onclick=uform()>＋ Add user</button></div><div class=card>${S.users.map(u=>`<div class=ln><span><b>${esc(u.n)}</b><small>${u.r}${u.on?'':' · disabled'}</small></span><span><button class=sm onclick="upin('${u.id}')">Reset PIN</button> ${u.id!=S.ses?`<button class=sm onclick="utog('${u.id}')">${u.on?'Disable':'Enable'}</button>`:''}</span></div>`).join('')}</div>
 ${cloudCard()}<div class=card style="margin-top:12px"><h3>Device and sync</h3><p class=mu>${navigator.onLine?'Online':'Offline'} · ${pend()} records waiting to sync. Everything is stored on this device first.</p><div class=row><button class=btn onclick="sync().then(views.users)">Sync now</button><button class="btn alt" onclick=csv()>Backup CSV</button><button class="btn alt" onclick="modal('<h3>Reset all data?</h3><p class=mu>This erases all products, customers and sales on this device. User accounts are kept.</p><button class=btn onclick=rst()>Yes, reset</button><button class=\'btn ghost\' onclick=closeM()>Cancel</button>')">Erase all records</button></div></div>`};
function rst(){if(!adm())return;if(S.cloud)return toast('Erase is only for single-device mode. With cloud sync the records live on the server.');const u=S.users,th=S.th,ses=S.ses;S=seed();S.users=u;S.th=th;S.ses=ses;save();closeM();views.users()}
function uform(){if(!adm())return;modal(`<h3>New user</h3>${fld('u1','Name','')}<label>Role<select id=u2><option value=attendant>Attendant</option><option value=owner>Owner</option></select></label>${fld('u3','PIN (4–8 digits)','','password')}<button class=btn onclick=usave()>Create</button><button class="btn ghost" onclick=closeM()>Cancel</button>`)}
function usave(){if(!adm())return;const n=$('#u1').value.trim(),p=$('#u3').value;if(!n||!/^\d{4,8}$/.test(p))return toast('Enter a name and a 4–8 digit PIN');S.users.push({id:'u'+Date.now(),n,r:$('#u2').value,h:H(p),on:1});save();closeM();views.users()}
function upin(id){if(!adm())return;modal(`<h3>Reset PIN</h3>${fld('np','New PIN (4–8 digits)','','password')}<button class=btn onclick="const p=$('#np').value;if(!/^\\d{4,8}$/.test(p))return toast('Use 4–8 digits');S.users.find(u=>u.id=='${id}').h=H(p);save();closeM();toast('PIN updated')">Save</button><button class="btn ghost" onclick=closeM()>Cancel</button>`)}
function utog(id){if(!adm())return;const u=S.users.find(x=>x.id==id);u.on=u.on?0:1;save();views.users()}

/* ---------- AI assistant (runs on the device, works offline when typed) ---------- */
const STOP=new Set('find me a an the for of with show search i want need please do you have any get under below above over less more than ghs gh cedis cedi price brand and in at is it to there got'.split(' ')),SYN={powdered:'powder',tin:'canned',tinned:'canned',cooking:'oil',nappy:'diaper'};
const nsz=(v,u)=>/^(kg|l|ltr|litre|liter)$/.test(u)?v*1000:+v,psz=u=>{const m=String(u).toLowerCase().match(/^(\d+(?:\.\d+)?)\s?(kg|g|ml|l)$/);return m?nsz(+m[1],m[2]):0};
function srch(q){q=q.toLowerCase();let mx=1e9,mn=0,m;const pr='(?:gh[s¢₵c]?\\s*)?(\\d+(?:\\.\\d+)?)',notes=[];
 if(m=q.match(new RegExp('(?:under|below|less than|cheaper than|<)\\s*'+pr)))mx=+m[1];
 if(m=q.match(new RegExp('(?:above|over|more than|>)\\s*'+pr)))mn=+m[1];
 const sm=q.match(/(\d+(?:\.\d+)?)\s?(kg|g|ml|ltr|litre|liter|l)\b/);
 const rest=q.replace(new RegExp('(?:under|below|less than|cheaper than|above|over|more than|<|>)\\s*'+pr,'g'),' ').replace(/(\d+(?:\.\d+)?)\s?(kg|g|ml|ltr|litre|liter|l)\b/g,' ');
 const tk=rest.split(/[^a-z]+/).filter(w=>w&&!STOP.has(w)).map(w=>SYN[w]||w.replace(/s$/,''));
 let L=S.products.map(p=>({p,sc:tk.filter(w=>hay(p).includes(w)).length})).filter(x=>!tk.length||x.sc>0);
 const full=L.filter(x=>x.sc==tk.length);if(full.length)L=full;else if(L.length)notes.push('No exact match, so here are close items.');
 const a=L.map(x=>x.p);let r=a.filter(p=>p.p<=mx&&p.p>=mn&&(!sm||psz(p.u)==nsz(+sm[1],sm[2])));
 if(!r.length&&sm){r=a.filter(p=>p.p<=mx&&p.p>=mn);if(r.length)notes.push('No '+sm[1]+sm[2]+' size, showing other sizes.')}
 if(!r.length&&(mx<1e9||mn)&&a.length){r=a;notes.push('Nothing in that price range, showing the closest.')}
 return{r:r.slice(0,5),notes}}
const prow=p=>`<div class=ln><span><b>${esc(p.n)}</b> ${esc(p.u)}<small>${money(p.p)} · ${p.s<1?'out of stock':p.s+' in stock'}</small></span>${p.s>0?`<button class=sm onclick="addC('${p.id}',1)">＋ Add</button>`:''}</div>`;
function aiR(q){const l=q.toLowerCase(),mg=isM(),t0=day0(Date.now());
 if(/\b(owe|owes|debt|debtor|ledger)\b/.test(l)){if(!mg)return'Customer balances are for the owner. Please ask the owner.';const L=S.customers.filter(c=>bal(c)>0).sort((a,b)=>bal(b)-bal(a));return L.length?'<b>Customers who owe:</b>'+L.map(c=>`<div class=ln><span>${esc(c.n)}</span><b>${money(bal(c))}</b></div>`).join(''):'Nobody owes right now.'}
 if(/(today.?s? sales|sales today|sold today|revenue|total sales|how much.*(sold|sales))/.test(l)){if(!mg)return'Daily totals are shown to the owner. Please ask the owner.';const ts=S.sales.filter(s=>s.t>=t0);return`Today so far: <b>${money(ts.reduce((a,s)=>a+s.tot,0))}</b> from ${ts.length} sales.`}
 if(/(low stock|running out|restock|finish(ed|ing)|out of stock)/.test(l)&&!/\b(milk|rice|oil|sugar)\b/.test(l)){const L=S.products.filter(p=>p.s<=p.m);return L.length?'<b>Low or out of stock:</b>'+L.map(p=>`<div class=ln><span>${esc(p.n)} ${esc(p.u)}</span><span class="badge ${p.s<1?'rd':'am'}">${p.s<1?'Out':p.s+' left'}</span></div>`).join(''):'Everything is well stocked.'}
 const {r,notes}=srch(q);if(!r.length)return'I could not find that item. Try a brand, a size, or a price, for example “500g powdered milk under 50”.';
 let h=(notes.length?`<small>${notes.join(' ')}</small>`:'')+r.map(prow).join('');
 r.filter(p=>p.s<1).forEach(p=>{const sb=S.products.filter(x=>x.c==p.c&&x.s>0&&x.id!=p.id).sort((a,b)=>Math.abs(a.p-p.p)-Math.abs(b.p-p.p)).slice(0,2);if(sb.length)h+=`<small>${esc(p.n)} is out of stock. Similar items:</small>`+sb.map(prow).join('')});return h}
views.assistant=()=>{if(!CHAT.length)CHAT.push({r:'b',h:'Hello! Ask me about any item, for example <b>“500g powdered milk under 50”</b>. Tap 🎤 to speak. I also suggest substitutes when something is out of stock.'});
 $('#v').innerHTML=`<div class=chat><div class=msgs id=ms></div><div class=chips>${['Milk powder under 50','Rice 5kg','What is low in stock?','Who owes us money?','Sales today'].map(x=>`<button onclick="ask('${x}')">${x}</button>`).join('')}</div>
 <div class=sb><button class=ic onclick="ui.sp=!ui.sp;this.style.opacity=ui.sp?1:.4" style="opacity:${ui.sp?1:.4}" title="Read answers aloud">🔊</button><input id=ai placeholder="Type or speak an item…" onkeydown="if(event.key=='Enter')ask()"><button class="ic mic" id=mic onclick="mic(t=>ask(t,1))">🎤</button><button class=btn onclick=ask()>Send</button></div></div>`;msgs()};
function msgs(){const e=$('#ms');if(!e)return;e.innerHTML=CHAT.map(m=>`<div class="m ${m.r=='u'?'u':''}">${m.r=='u'?esc(m.h):m.h}</div>`).join('');e.scrollTop=e.scrollHeight}
function ask(q,v){q=(q||$('#ai').value||'').trim();if(!q)return;if($('#ai'))$('#ai').value='';CHAT.push({r:'u',h:q});const h=aiR(q);CHAT.push({r:'b',h});msgs();
 if(v||ui.sp)try{speechSynthesis.speak(new SpeechSynthesisUtterance(h.replace(/<[^>]+>/g,' ').replace(/＋ Add/g,'')))}catch(e){}}
function mic(cb){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast('Voice input is not supported in this browser. Please type instead.');return}
 const r=new R(),b=$('#mic');r.lang='en-GH';r.onstart=()=>b&&b.classList.add('live');r.onend=()=>b&&b.classList.remove('live');
 r.onresult=e=>cb(e.results[0][0].transcript);r.onerror=()=>toast('Could not hear you. Voice may need internet, you can type instead.');try{r.start()}catch(e){}}


/* ---------- supplier orders (owner only) ---------- */
const oln=(a,b)=>`<div class=ln><span>${a}</span><b>${b}</b></div>`,supN=id=>(S.sup.find(x=>x.id==id)||{n:'-'}).n,ph233=n=>{n=String(n||'').replace(/\D/g,'');return /^0\d{9}$/.test(n)?'233'+n.slice(1):n};
views.orders=()=>{if(!own())return;const low=S.products.filter(p=>p.s<=p.m);
$('#v').innerHTML=`<div class=bar><h2>Supplier orders</h2><button class=btn onclick=ofor()>＋ New order</button><button class="btn alt" onclick=sform()>＋ Supplier</button></div>
<div class=card><h3>Low stock (${low.length})</h3>${low.map(p=>oln(esc(p.n+' '+p.u),`<span class="badge ${p.s<1?'rd':'am'}">${p.s<1?'Out':p.s+' left'}</span>`)).join('')||'<p class=mu>Nothing is low right now.</p>'}</div>
<div class=card style="margin-top:12px"><h3>Orders</h3>${S.ord.slice().reverse().map(o=>`<div class=ln><span><b>${o.id}</b> <span class="badge ${o.st=='sent'?'am':''}">${o.st=='sent'?'Waiting for delivery':'Received'}</span><small>${esc(supN(o.sp))} · ${new Date(o.t).toLocaleDateString('en-GB')} · ${o.it.length} items · ${money(o.tot)}</small></span><span>${o.st=='sent'?`<button class=sm onclick="osend('${o.id}')">Send</button> <button class=sm onclick="orecv('${o.id}')">Received</button>`:''}</span></div>`).join('')||'<p class=mu>No orders yet.</p>'}</div>
<div class=card style="margin-top:12px"><h3>Suppliers</h3>${S.sup.map(x=>oln(esc(x.n),esc(x.ph||x.em||''))).join('')||'<p class=mu>Add a supplier first, then create an order.</p>'}</div>`};
function sform(){if(!own())return;modal(`<h3>New supplier</h3>${fld('sn','Supplier name','')}${fld('sp','Phone (WhatsApp or SMS)','','tel')}${fld('se','Email (optional)','','email')}<button class=btn onclick=ssave()>Save supplier</button><button class="btn ghost" onclick=closeM()>Cancel</button>`)}
function ssave(){if(!own())return;const n=$('#sn').value.trim();if(!n||!($('#sp').value.trim()||$('#se').value.trim()))return toast('Enter a name and a phone or email');S.sup.push({id:'s'+Date.now(),n,ph:$('#sp').value.trim(),em:$('#se').value.trim()});save();closeM();views.orders()}
function ofor(){if(!own())return;if(!S.sup.length)return toast('Add a supplier first');const low=S.products.filter(p=>p.s<=p.m);if(!low.length)return toast('No low-stock items to order');ui.ol=low.map(p=>p.id);
modal(`<h3>New order</h3><label>Supplier<select id=osp>${S.sup.map(x=>`<option value="${x.id}">${esc(x.n)}</option>`).join('')}</select></label>${low.map((p,i)=>`<div class=ln><label class=chk><input type=checkbox id=oc${i} checked> ${esc(p.n+' '+p.u)} <small>(${p.s} left)</small></label><input id=oq${i} type=number min=1 value="${Math.max(p.m*2-p.s,1)}" style="width:80px"></div>`).join('')}<button class=btn onclick=ocreate()>Create order</button><button class="btn ghost" onclick=closeM()>Cancel</button>`)}
function ocreate(){if(!own())return;const it=ui.ol.map((id,i)=>{const p=prod(id),q=+$('#oq'+i).value;return $('#oc'+i).checked&&q>0&&p?{id,n:p.n+' '+p.u,q,k:p.k}:null}).filter(Boolean);if(!it.length)return toast('Select at least one item');
const o={id:'PO-'+dv()+'-'+String(S.on).padStart(4,'0'),t:Date.now(),sp:$('#osp').value,st:'sent',u:S.ses,it,tot:it.reduce((a,x)=>a+x.q*x.k,0)};S.on++;S.ord.push(o);save();views.orders();osend(o.id)}
function otext(o){return['JalZintech Provision Shop, Tamale','Order '+o.id+' · '+new Date(o.t).toLocaleDateString('en-GB'),...o.it.map(x=>x.q+' x '+x.n),'Please confirm availability, price and delivery. Thank you.'].join('\n')}
function osend(id){if(!own())return;const o=S.ord.find(x=>x.id==id),sp=S.sup.find(x=>x.id==o.sp),t=encodeURIComponent(otext(o)),ph=sp.ph;
modal(`<h3>Send ${o.id} to ${esc(sp.n)}</h3><pre class=mu style="white-space:pre-wrap;font:inherit">${esc(otext(o))}</pre>${ph?`<button class=btn onclick="smsSend('${ph233(ph)}',${esc(JSON.stringify(otext(o))).replace(/'/g,'&#39;')},()=>go('sms:${ph}?&body=${t}'))">Send by SMS</button><button class="btn alt" onclick="go('https://wa.me/${ph233(ph)}?text=${t}')">Send by WhatsApp</button>`:''}${sp.em?`<button class="btn alt" onclick="go('mailto:${sp.em}?subject=${encodeURIComponent('Order '+o.id)}&body=${t}')">Send by email</button>`:''}<button class="btn ghost" onclick=closeM()>Close</button>`)}
function orecv(id){if(!own())return;const o=S.ord.find(x=>x.id==id);if(!o||o.st!='sent'||!confirm('Mark '+o.id+' as received and add these items to stock?'))return;o.it.forEach(x=>{const p=prod(x.id);if(p)p.s+=x.q});o.st='received';o.rt=Date.now();save();views.orders();toast('Stock updated')}

/* ---------- boot ---------- */
try{S=JSON.parse(store.get())}catch(e){}
if(!S||!S.users)S=seed();S.sup=S.sup||[];S.ord=S.ord||[];S.on=S.on||1;dv();S.toks=S.toks||{};S.since=S.since||0;S.snap=S.snap||{};['products','customers','sup','ord','users'].forEach(k=>S.snap[k]=S.snap[k]||{});document.documentElement.dataset.theme=S.th||'';CART=newCart();
addEventListener('online',()=>{netui();sync(true)});addEventListener('offline',netui);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(()=>{if(S.cloud&&S.ses&&!document.hidden)sync(true)},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync(true)});
addEventListener('hashchange',()=>{view=location.hash.slice(1);if(S.ses)render()});
view=location.hash.slice(1);render();
